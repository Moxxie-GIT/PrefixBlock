# Catalogue de versions PrefixBlock.
#
# Contraintes de compatibilité (vérifiées le 2026-11-24) :
# - AGP 9.2.1 = dernière version stable supportée par Android Studio 2026.1.1
#   (plugins/android/lib/libagp-version.jar -> lastStableBuildVersion).
#   AGP 9 intègre Kotlin : pas de plugin org.jetbrains.kotlin.android.
# - Kotlin 2.3.21 : aligné sur le plugin Kotlin de l'IDE (2.3.10) et sur Hilt 2.60.1
#   (compilé avec Kotlin 2.3.21).
# - kotlinx-serialization 1.11.0 : dernière version compilée avec Kotlin 2.3.x
#   (1.12+ requiert Kotlin 2.4).
# - compileSdk 37 : requis par core 1.19 / lifecycle 2.11 / navigation 2.10 / hilt 1.4.
# - Compose BOM 2026.09.00 (Compose 1.12.1, Material 3 1.4.0) : la BOM 2026.11.01
#   (Compose 1.13) exige compileSdk 37.1, non supporté par AGP 9.2.1.
#   Pour la dépasser : mettre à jour Android Studio, puis AGP (9.5+) et compileSdk 37.1.
# Avant toute montée de version, revérifier ces couples.

[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.14"
hilt = "2.60.1"

androidx-core = "1.19.1"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.1"
androidx-navigation = "2.10.2"
androidx-hilt = "1.4.0"
compose-bom = "2026.09.00"
room = "2.8.5"

kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
libphonenumber = "9.0.44"

junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
